spring:
  application:
    name: supermarket-meal-planner-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meal_planner}
    username: ${DB_USER:meal_planner}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

app:
  catalog:
    demo-resource: classpath:data/mock/mercadona-catalog.json
    seed-enabled: ${CATALOG_SEED_ENABLED:true}
  meal-templates:
    demo-resource: classpath:data/mock/meal-templates.json
    seed-enabled: ${MEAL_TEMPLATE_SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method

server:
  shutdown: graceful

spring:
  application:
    name: supermarket-meal-planner-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meal_planner}
    username: ${DB_USER:meal_planner}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

app:
  catalog:
    demo-resource: classpath:data/mock/mercadona-catalog.json
    seed-enabled: ${CATALOG_SEED_ENABLED:true}
  meal-templates:
    demo-resource: classpath:data/mock/meal-templates.json
    seed-enabled: ${MEAL_TEMPLATE_SEED_ENABLED:true}
  meal-plans:
    purchase-aware:
      reference-cost-per-meal: 2.50
      purchase-cost-score-slope: 35
      consumed-cost-score-slope: 20
      waste-cost-score-slope: 100
      unique-product-penalty: 4
      package-count-penalty: 2
      budget-exceeded-penalty-factor: 4
      balanced:
        calories: 21
        protein: 21
        purchaseCost: 10
        consumedCost: 2
        budget: 14
        wasteCost: 10
        wastePercentage: 10
        usefulReuse: 4
        uniqueProducts: 1
        packageCount: 2
        variety: 2
        repetition: 1
        completeness: 1
        preparation: 1
      lower-purchase-cost:
        calories: 21
        protein: 21
        purchaseCost: 16
        consumedCost: 2
        budget: 18
        wasteCost: 5
        wastePercentage: 4
        usefulReuse: 3
        uniqueProducts: 2
        packageCount: 3
        variety: 2
        repetition: 1
        completeness: 1
        preparation: 1
      lower-waste:
        calories: 20
        protein: 20
        purchaseCost: 8
        consumedCost: 2
        budget: 14
        wasteCost: 12
        wastePercentage: 12
        usefulReuse: 4
        uniqueProducts: 1
        packageCount: 2
        variety: 2
        repetition: 1
        completeness: 1
        preparation: 1
      more-reuse:
        calories: 21
        protein: 21
        purchaseCost: 6
        consumedCost: 2
        budget: 14
        wasteCost: 6
        wastePercentage: 6
        usefulReuse: 10
        uniqueProducts: 5
        packageCount: 3
        variety: 2
        repetition: 2
        completeness: 1
        preparation: 1
    scoring:
      beam-width: 24
      candidates-per-position: 8
      calorie-weight: 25
      protein-weight: 25
      budget-weight: 15
      variety-weight: 15
      repetition-weight: 10
      completeness-weight: 5
      preparation-weight: 5
      ideal-calorie-margin-percentage: 5
      warning-calorie-margin-percentage: 10
      nutritional-distribution-share: 20
      template-variety-share: 60
      ingredient-variety-share: 25
      meal-type-variety-share: 15
      calorie-deviation-penalty-factor: 4
      protein-deficit-penalty-factor: 3
      budget-exceeded-penalty-factor: 4
      excess-repetition-penalty: 12
      same-day-repetition-penalty: 20
      consecutive-repetition-penalty: 8
      incomplete-meal-penalty: 20
      preparation-ratio-penalty: 20
      candidate-calorie-penalty-factor: 0.40
      candidate-protein-penalty-factor: 0.60
      candidate-budget-penalty-factor: 0.30
      candidate-preparation-minute-penalty: 0.15
      candidate-incomplete-penalty: 50
      beam-excess-repetition-penalty: 18
      beam-same-day-repetition-penalty: 25
      beam-consecutive-repetition-penalty: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method

server:
  shutdown: graceful

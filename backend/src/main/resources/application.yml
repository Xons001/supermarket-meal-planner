spring:
  profiles:
    default: development
  application:
    name: supermarket-meal-planner-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meal_planner}
    username: ${DB_USER:meal_planner}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

app:
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    email: ${APP_DEMO_EMAIL:}
    password: ${APP_DEMO_PASSWORD:}
  admin:
    enabled: ${APP_ADMIN_ENABLED:false}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  auth:
    access-token-secret: ${APP_AUTH_ACCESS_TOKEN_SECRET}
    refresh-token-secret: ${APP_AUTH_REFRESH_TOKEN_SECRET}
    issuer: ${APP_AUTH_ISSUER:supermarket-meal-planner}
    access-ttl: ${APP_AUTH_ACCESS_TTL:PT15M}
    refresh-ttl: ${APP_AUTH_REFRESH_TTL:P30D}
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:true}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
    allowed-origins: ${APP_AUTH_ALLOWED_ORIGINS:}
    swagger-enabled: ${APP_AUTH_SWAGGER_ENABLED:false}
    argon2:
      salt-length: ${APP_AUTH_ARGON2_SALT_LENGTH:16}
      hash-length: ${APP_AUTH_ARGON2_HASH_LENGTH:32}
      parallelism: ${APP_AUTH_ARGON2_PARALLELISM:1}
      memory-kb: ${APP_AUTH_ARGON2_MEMORY_KB:19456}
      iterations: ${APP_AUTH_ARGON2_ITERATIONS:2}
    rate-limits:
      login-per-minute: ${APP_AUTH_RATE_LOGIN_PER_MINUTE:5}
      register-per-hour: ${APP_AUTH_RATE_REGISTER_PER_HOUR:3}
      refresh-per-minute: ${APP_AUTH_RATE_REFRESH_PER_MINUTE:30}
      password-change-per-hour: ${APP_AUTH_RATE_PASSWORD_PER_HOUR:5}
  catalog:
    demo-resource: classpath:data/mock/mercadona-catalog.json
    seed-enabled: ${CATALOG_SEED_ENABLED:false}
  catalog-sync:
    enabled: ${APP_CATALOG_SYNC_ENABLED:false}
    provider: ${APP_CATALOG_SYNC_PROVIDER:LOCAL_JSON}
    airflow-base-url: ${APP_AIRFLOW_BASE_URL:http://localhost:8082}
    airflow-public-url: ${APP_AIRFLOW_PUBLIC_URL:}
    airflow-username: ${AIRFLOW_ADMIN_USERNAME:admin}
    airflow-password: ${AIRFLOW_ADMIN_PASSWORD:}
    full-schedule: ${APP_CATALOG_FULL_SYNC_SCHEDULE:0 3 * * *}
    price-schedule: ${APP_CATALOG_PRICE_SYNC_SCHEDULE:0 */6 * * *}
    manual-rate-per-hour: ${APP_CATALOG_SYNC_MANUAL_RATE_PER_HOUR:10}
    staging-retention-days: ${APP_CATALOG_SYNC_STAGING_RETENTION_DAYS:7}
  nutrition-enrichment:
    enabled: ${APP_NUTRITION_ENRICHMENT_ENABLED:false}
    cron: ${APP_NUTRITION_ENRICHMENT_CRON:0 4 * * 1}
    provider: ${APP_NUTRITION_PROVIDER:LOCAL_JSON}
    batch-size: ${APP_NUTRITION_BATCH_SIZE:100}
    auto-accept-threshold: ${APP_NUTRITION_AUTO_ACCEPT_THRESHOLD:95}
    manual-review-threshold: ${APP_NUTRITION_MANUAL_REVIEW_THRESHOLD:75}
    cache-ttl: ${APP_NUTRITION_CACHE_TTL:P7D}
    rejection-cooldown: ${APP_NUTRITION_REJECTION_COOLDOWN:P30D}
    manual-rate-per-hour: ${APP_NUTRITION_MANUAL_RATE_PER_HOUR:10}
    open-food-facts:
      enabled: ${APP_OPENFOODFACTS_ENABLED:false}
      base-url: ${APP_OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
      user-agent: ${APP_OPENFOODFACTS_USER_AGENT:SupermarketMealPlanner/0.1 (local-development)}
      timeout-seconds: ${APP_OPENFOODFACTS_TIMEOUT_SECONDS:10}
      max-retries: ${APP_OPENFOODFACTS_MAX_RETRIES:2}
      request-delay-ms: ${APP_OPENFOODFACTS_REQUEST_DELAY_MS:6500}
  meal-templates:
    demo-resource: classpath:data/mock/meal-templates.json
    seed-enabled: ${MEAL_TEMPLATE_SEED_ENABLED:false}
  observability:
    environment: ${APP_ENVIRONMENT:unknown}
    user-hash-secret: ${APP_OBSERVABILITY_USER_HASH_SECRET:}
    version: ${APP_VERSION:0.11.0-dev}
    commit: ${APP_COMMIT:unknown}
    build-time: ${APP_BUILD_TIME:unknown}
  meal-plans:
    editing:
      preview-hmac-secret: ${MEAL_PLAN_PREVIEW_HMAC_SECRET}
      preview-ttl: ${MEAL_PLAN_PREVIEW_TTL:PT15M}
    purchase-aware:
      reference-cost-per-meal: 2.50
      purchase-cost-score-slope: 35
      consumed-cost-score-slope: 20
      waste-cost-score-slope: 100
      unique-product-penalty: 4
      package-count-penalty: 2
      budget-exceeded-penalty-factor: 4
      balanced:
        calories: 21
        protein: 21
        purchaseCost: 10
        consumedCost: 2
        budget: 14
        wasteCost: 10
        wastePercentage: 10
        usefulReuse: 4
        uniqueProducts: 1
        packageCount: 2
        variety: 2
        repetition: 1
        completeness: 1
        preparation: 1
      lower-purchase-cost:
        calories: 21
        protein: 21
        purchaseCost: 16
        consumedCost: 2
        budget: 18
        wasteCost: 5
        wastePercentage: 4
        usefulReuse: 3
        uniqueProducts: 2
        packageCount: 3
        variety: 2
        repetition: 1
        completeness: 1
        preparation: 1
      lower-waste:
        calories: 20
        protein: 20
        purchaseCost: 8
        consumedCost: 2
        budget: 14
        wasteCost: 12
        wastePercentage: 12
        usefulReuse: 4
        uniqueProducts: 1
        packageCount: 2
        variety: 2
        repetition: 1
        completeness: 1
        preparation: 1
      more-reuse:
        calories: 21
        protein: 21
        purchaseCost: 6
        consumedCost: 2
        budget: 14
        wasteCost: 6
        wastePercentage: 6
        usefulReuse: 10
        uniqueProducts: 5
        packageCount: 3
        variety: 2
        repetition: 2
        completeness: 1
        preparation: 1
    scoring:
      beam-width: 24
      candidates-per-position: 8
      calorie-weight: 25
      protein-weight: 25
      budget-weight: 15
      variety-weight: 15
      repetition-weight: 10
      completeness-weight: 5
      preparation-weight: 5
      ideal-calorie-margin-percentage: 5
      warning-calorie-margin-percentage: 10
      nutritional-distribution-share: 20
      template-variety-share: 60
      ingredient-variety-share: 25
      meal-type-variety-share: 15
      calorie-deviation-penalty-factor: 4
      protein-deficit-penalty-factor: 3
      budget-exceeded-penalty-factor: 4
      excess-repetition-penalty: 12
      same-day-repetition-penalty: 20
      consecutive-repetition-penalty: 8
      incomplete-meal-penalty: 20
      preparation-ratio-penalty: 20
      candidate-calorie-penalty-factor: 0.40
      candidate-protein-penalty-factor: 0.60
      candidate-budget-penalty-factor: 0.30
      candidate-preparation-minute-penalty: 0.15
      candidate-incomplete-penalty: 50
      beam-excess-repetition-penalty: 18
      beam-same-day-repetition-penalty: 25
      beam-consecutive-repetition-penalty: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      status:
        order: down,out-of-service,degraded,unknown,up
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,flywayReadiness
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: ${APP_TRACING_SAMPLE_PROBABILITY:1.0}

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:0.11.0-dev}
    commit: ${APP_COMMIT:unknown}
    buildTime: ${APP_BUILD_TIME:unknown}

springdoc:
  api-docs:
    enabled: ${APP_AUTH_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${APP_AUTH_SWAGGER_ENABLED:false}
    path: /swagger-ui/index.html
    operations-sorter: method

server:
  shutdown: graceful

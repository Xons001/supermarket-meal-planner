name: Security
on:
  pull_request: {}
  schedule: [{ cron: "17 5 * * 1" }]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.22.0, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "airflow/requirements*.txt" }
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - run: pip install -r airflow/requirements.txt && pip-audit -r airflow/requirements-runtime.txt
      - run: ./backend/mvnw -f backend/pom.xml org.owasp:dependency-check-maven:12.1.8:check -DfailBuildOnCVSS=8
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with: { scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, exit-code: "1" }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

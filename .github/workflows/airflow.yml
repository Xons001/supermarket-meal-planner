name: Airflow
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "airflow/requirements*.txt" }
      - run: pip install -r airflow/requirements.txt
      - run: ruff check airflow && pytest -q airflow/tests
      - run: cyclonedx-py environment --output-file airflow-sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: airflow-reports-sbom, path: "{airflow-sbom.json,airflow/logs}", retention-days: 14 }

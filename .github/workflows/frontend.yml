name: Frontend
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.22.0, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: echo "VITE_APP_VERSION=$(bash ../scripts/resolve-version.sh)" >> "$GITHUB_ENV"
      - run: npm run typecheck && npm run lint && npm run format:check && npm run test && npm run build
      - run: npx --yes @cyclonedx/cyclonedx-npm@4.1.1 --output-file frontend-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: frontend-reports-sbom, path: "frontend/{coverage,dist,frontend-sbom.json}", retention-days: 14 }

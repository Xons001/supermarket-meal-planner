name: ${COMPOSE_PROJECT_NAME:-supermarket-meal-planner}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meal_planner}
      POSTGRES_USER: ${POSTGRES_USER:-meal_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-meal_planner} -d ${POSTGRES_DB:-meal_planner}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meal_planner}
      DB_USER: ${POSTGRES_USER:-meal_planner}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      CATALOG_SEED_ENABLED: "true"
      MEAL_PLAN_PREVIEW_HMAC_SECRET: ${MEAL_PLAN_PREVIEW_HMAC_SECRET:?MEAL_PLAN_PREVIEW_HMAC_SECRET is required}
      MEAL_PLAN_PREVIEW_TTL: ${MEAL_PLAN_PREVIEW_TTL:-PT15M}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend-test:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /workspace/backend
    command: ["sh", "./mvnw", "verify"]
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

  frontend-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  maven_cache:

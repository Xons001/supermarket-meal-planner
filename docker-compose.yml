name: ${COMPOSE_PROJECT_NAME:-supermarket-meal-planner}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  restart: unless-stopped
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Madrid
    PYTHONPATH: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}@airflow-postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:?AIRFLOW_API_JWT_SECRET is required}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?AIRFLOW_WEBSERVER_SECRET_KEY is required}
    APP_DB_HOST: postgres
    APP_DB_PORT: 5432
    APP_DB_NAME: ${POSTGRES_DB:-meal_planner}
    APP_DB_USER: ${POSTGRES_USER:-meal_planner}
    APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    CATALOG_SYNC_PROVIDER: ${APP_CATALOG_SYNC_PROVIDER:-LOCAL_JSON}
    CATALOG_PROVIDER_FILE: ${CATALOG_PROVIDER_FILE:-/opt/airflow/data/mock/mercadona-catalog.json}
    CATALOG_FULL_SYNC_SCHEDULE: ${APP_CATALOG_FULL_SYNC_SCHEDULE:-0 3 * * *}
    CATALOG_PRICE_SYNC_SCHEDULE: ${APP_CATALOG_PRICE_SYNC_SCHEDULE:-0 */6 * * *}
    CATALOG_SYNC_STAGING_RETENTION_DAYS: ${APP_CATALOG_SYNC_STAGING_RETENTION_DAYS:-7}
    MERCADONA_EXPERIMENTAL_PROVIDER_ENABLED: "false"
    NUTRITION_ENRICHMENT_CRON: ${APP_NUTRITION_ENRICHMENT_CRON:-0 4 * * 1}
    NUTRITION_PROVIDER: ${APP_NUTRITION_PROVIDER:-LOCAL_JSON}
    NUTRITION_BATCH_SIZE: ${APP_NUTRITION_BATCH_SIZE:-100}
    NUTRITION_AUTO_ACCEPT_THRESHOLD: ${APP_NUTRITION_AUTO_ACCEPT_THRESHOLD:-95}
    NUTRITION_MANUAL_REVIEW_THRESHOLD: ${APP_NUTRITION_MANUAL_REVIEW_THRESHOLD:-75}
    NUTRITION_CACHE_TTL_DAYS: ${APP_NUTRITION_CACHE_TTL_DAYS:-7}
    NUTRITION_REJECTION_COOLDOWN_DAYS: ${APP_NUTRITION_REJECTION_COOLDOWN_DAYS:-30}
    NUTRITION_PROVIDER_FILE: ${NUTRITION_PROVIDER_FILE:-/opt/airflow/data/mock/mercadona-catalog.json}
    NUTRITION_OVERRIDE_FILE: ${NUTRITION_OVERRIDE_FILE:-/opt/airflow/data/providers/nutrition/local-nutrition-overrides.json}
    OPEN_FOOD_FACTS_ENABLED: ${APP_OPENFOODFACTS_ENABLED:-false}
    OPEN_FOOD_FACTS_BASE_URL: ${APP_OPENFOODFACTS_BASE_URL:-https://world.openfoodfacts.org}
    OPEN_FOOD_FACTS_USER_AGENT: ${APP_OPENFOODFACTS_USER_AGENT:-SupermarketMealPlanner/0.1 (local-development)}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data:ro
    - airflow_catalog_tmp:/opt/airflow/catalog-tmp
  networks:
    - app_network
  depends_on:
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meal_planner}
      POSTGRES_USER: ${POSTGRES_USER:-meal_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-meal_planner} -d ${POSTGRES_DB:-meal_planner}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meal_planner}
      DB_USER: ${POSTGRES_USER:-meal_planner}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      CATALOG_SEED_ENABLED: "true"
      MEAL_PLAN_PREVIEW_HMAC_SECRET: ${MEAL_PLAN_PREVIEW_HMAC_SECRET:?MEAL_PLAN_PREVIEW_HMAC_SECRET is required}
      MEAL_PLAN_PREVIEW_TTL: ${MEAL_PLAN_PREVIEW_TTL:-PT15M}
      APP_AUTH_ACCESS_TOKEN_SECRET: ${APP_AUTH_ACCESS_TOKEN_SECRET:?APP_AUTH_ACCESS_TOKEN_SECRET is required}
      APP_AUTH_REFRESH_TOKEN_SECRET: ${APP_AUTH_REFRESH_TOKEN_SECRET:?APP_AUTH_REFRESH_TOKEN_SECRET is required}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      APP_AUTH_COOKIE_SAME_SITE: ${APP_AUTH_COOKIE_SAME_SITE:-Lax}
      APP_AUTH_ALLOWED_ORIGINS: ${APP_AUTH_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_AUTH_SWAGGER_ENABLED: ${APP_AUTH_SWAGGER_ENABLED:-true}
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-false}
      APP_DEMO_EMAIL: ${APP_DEMO_EMAIL:-}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-}
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-false}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_CATALOG_SYNC_ENABLED: ${APP_CATALOG_SYNC_ENABLED:-true}
      APP_CATALOG_SYNC_PROVIDER: ${APP_CATALOG_SYNC_PROVIDER:-LOCAL_JSON}
      APP_AIRFLOW_BASE_URL: http://airflow-apiserver:8080
      APP_AIRFLOW_PUBLIC_URL: ${APP_AIRFLOW_PUBLIC_URL:-http://localhost:8082}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
      APP_CATALOG_FULL_SYNC_SCHEDULE: ${APP_CATALOG_FULL_SYNC_SCHEDULE:-0 3 * * *}
      APP_CATALOG_PRICE_SYNC_SCHEDULE: ${APP_CATALOG_PRICE_SYNC_SCHEDULE:-0 */6 * * *}
      APP_CATALOG_SYNC_MANUAL_RATE_PER_HOUR: ${APP_CATALOG_SYNC_MANUAL_RATE_PER_HOUR:-10}
      APP_NUTRITION_ENRICHMENT_ENABLED: ${APP_NUTRITION_ENRICHMENT_ENABLED:-true}
      APP_NUTRITION_ENRICHMENT_CRON: ${APP_NUTRITION_ENRICHMENT_CRON:-0 4 * * 1}
      APP_NUTRITION_PROVIDER: ${APP_NUTRITION_PROVIDER:-LOCAL_JSON}
      APP_NUTRITION_BATCH_SIZE: ${APP_NUTRITION_BATCH_SIZE:-100}
      APP_NUTRITION_AUTO_ACCEPT_THRESHOLD: ${APP_NUTRITION_AUTO_ACCEPT_THRESHOLD:-95}
      APP_NUTRITION_MANUAL_REVIEW_THRESHOLD: ${APP_NUTRITION_MANUAL_REVIEW_THRESHOLD:-75}
      APP_NUTRITION_CACHE_TTL: ${APP_NUTRITION_CACHE_TTL:-P7D}
      APP_NUTRITION_REJECTION_COOLDOWN: ${APP_NUTRITION_REJECTION_COOLDOWN:-P30D}
      APP_NUTRITION_MANUAL_RATE_PER_HOUR: ${APP_NUTRITION_MANUAL_RATE_PER_HOUR:-10}
      APP_OPENFOODFACTS_ENABLED: ${APP_OPENFOODFACTS_ENABLED:-false}
      APP_OPENFOODFACTS_BASE_URL: ${APP_OPENFOODFACTS_BASE_URL:-https://world.openfoodfacts.org}
      APP_OPENFOODFACTS_USER_AGENT: ${APP_OPENFOODFACTS_USER_AGENT:-SupermarketMealPlanner/0.1 (local-development)}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  airflow-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_DB_PASSWORD:?AIRFLOW_METADATA_DB_PASSWORD is required}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    restart: "no"
    user: "0:0"
    command:
      - bash
      - -ec
      - >
        mkdir -p /opt/airflow/catalog-tmp /opt/airflow/logs &&
        chown -R 50000:0 /opt/airflow/catalog-tmp /opt/airflow/logs &&
        airflow db migrate &&
        airflow users create
        --username "$${AIRFLOW_ADMIN_USERNAME}"
        --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname Local --lastname Administrator
        --role Admin --email airflow-admin@localhost
        || true
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_UI_HOST_PORT:-8082}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command:
      - bash
      - -ec
      - >
        until airflow dags list 2>/dev/null | grep -q catalog_full_sync; do sleep 2; done;
        airflow dags unpause -y catalog_full_sync;
        airflow dags unpause -y catalog_price_sync;
        airflow dags unpause -y catalog_sync_cleanup;
        airflow dags unpause -y nutrition_enrichment;
        exec airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-test:
    <<: *airflow-common
    profiles: ["tools"]
    restart: "no"
    entrypoint: []
    command: ["pytest", "-q", "/opt/airflow/tests"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/tests:/opt/airflow/tests:ro

  backend-test:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /workspace/backend
    command: ["sh", "./mvnw", "verify"]
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      APP_AUTH_ACCESS_TOKEN_SECRET: test-access-secret-at-least-thirty-two-bytes
      APP_AUTH_REFRESH_TOKEN_SECRET: test-refresh-secret-at-least-thirty-two-bytes
      MEAL_PLAN_PREVIEW_HMAC_SECRET: test-preview-secret-at-least-thirty-two-bytes
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

  frontend-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_catalog_tmp:
  maven_cache:
